<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200"><rect width="1200" height="1200" fill="#f5f6ef"/><g font-family="PingFang SC,sans-serif"><text x="80" y="110" font-size="25" fill="#137e80" letter-spacing="5">TAIL LENS / 实测样本观察台</text><text x="80" y="240" font-size="88" font-weight="700" fill="#132d36">尾延迟透镜</text><text x="80" y="320" font-size="38" fill="#567077">平均很快，为什么还会等？</text><rect x="70" y="390" width="1060" height="370" rx="24" fill="white"/><text x="110" y="455" font-size="28" fill="#567077">虚构 A 组 · 20 条成功耗时</text><text x="110" y="555" font-size="72" fill="#137e80" font-weight="700">210 ms</text><text x="650" y="555" font-size="72" fill="#c25c36" font-weight="700">1,500 ms</text><text x="110" y="615" font-size="30" fill="#132d36">P50 · 日常等待</text><text x="650" y="615" font-size="30" fill="#132d36">P95 · 较慢的那端</text><line x1="110" y1="682" x2="1085" y2="682" stroke="#d4e2df" stroke-width="2"/><rect x="110" y="670" width="136.5" height="24" rx="6" fill="#137e80"/><circle cx="1085" cy="682" r="13" fill="#c25c36"/><text x="110" y="730" font-size="22" fill="#567077">条长按 P50 / P95 比例绘制</text><text x="80" y="855" font-size="34" fill="#132d36">分位数 · 失败次数 · 样本目标预算</text><text x="80" y="940" font-size="29" fill="#567077">成功耗时单独算，失败也不漏账。</text><text x="80" y="1030" font-size="25" fill="#567077">最近秩定义，无插值；只描述输入样本</text><text x="80" y="1090" font-size="25" fill="#567077">不代表总体 SLA 或未来体验 · V1.0.0</text></g></svg>